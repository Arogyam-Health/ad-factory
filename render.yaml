services:
  - type: web
    name: ad-factory
    env: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements-dashboard.txt && python -m playwright install chromium
    startCommand: uvicorn dashboard.backend.app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DEPLOYMENT_MODE
        value: production
      - key: BROWSER_AUTOMATION_MODE
        value: local-agent
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ad_factory
      - key: APP_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_EXPIRE_MINUTES
        value: "1440"
      - key: STORAGE_PROVIDER
        value: local
      - key: PYTHON_VERSION
        value: "3.11"
