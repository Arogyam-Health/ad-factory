services:
  - type: web
    name: ad-factory
    env: python
    buildCommand: pip install -r requirements-dashboard.txt && playwright install chromium 2>/dev/null || true
    startCommand: uvicorn dashboard.backend.app:app --host 0.0.0.0 --port 4090
    envVars:
      - key: DEPLOYMENT_MODE
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ad_factory
      - key: APP_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://your-app.onrender.com/api/auth/google/callback
      - key: FRONTEND_ORIGIN
        value: https://your-app.onrender.com
      - key: CORS_ORIGINS
        value: https://your-app.onrender.com
      - key: SESSION_EXPIRE_MINUTES
        value: "1440"
      - key: PYTHON_VERSION
        value: "3.11"
