name: Reference flow checks

on:
  pull_request:
    paths:
      - "dashboard/backend/reference_flow.py"
      - "dashboard/backend/reference_library.py"
      - "dashboard/backend/chatgpt_watchdog.py"
      - "dashboard/backend/chatgpt_runtime_patch.py"
      - "dashboard/backend/routes/execute.py"
      - "dashboard/backend/routes/runs.py"
      - "dashboard/frontend/index.html"
      - "dashboard/frontend/reference-flow.css"
      - "dashboard/frontend/js/reference-flow.js"
      - "dashboard/frontend/js/image-comments.js"
      - "scripts/chatgpt_web_watchdog.py"
      - ".github/workflows/reference-flow-checks.yml"
  push:
    branches:
      - feature/reference-image-flow
      - fix/reference-persona-refresh-chatgpt-failures

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python files
        run: >-
          python -m py_compile
          dashboard/backend/reference_flow.py
          dashboard/backend/reference_library.py
          dashboard/backend/chatgpt_watchdog.py
          dashboard/backend/chatgpt_runtime_patch.py
          dashboard/backend/routes/execute.py
          dashboard/backend/routes/runs.py
          scripts/chatgpt_web_watchdog.py
      - name: Check frontend modules
        run: |
          node --check dashboard/frontend/js/reference-flow.js
          node --check dashboard/frontend/js/image-comments.js
      - name: Verify required UI and routes
        run: |
          grep -q 'id="referenceFlowPanel"' dashboard/frontend/index.html
          grep -q 'id="generationWorkspace"' dashboard/frontend/index.html
          grep -q '/api/reference-images' dashboard/backend/routes/execute.py
          grep -q '/api/runs/execute-reference' dashboard/backend/routes/execute.py
          grep -q '/revise-image' dashboard/backend/routes/runs.py
          grep -q 'ref_v' dashboard/backend/reference_library.py
          grep -q '8% clear margin' dashboard/backend/reference_flow.py
      - name: Verify live persona synchronization
        run: |
          grep -q 'refreshReferencePersonas' dashboard/frontend/js/reference-flow.js
          grep -q '/api/defaults?t=' dashboard/frontend/js/reference-flow.js
          grep -q 'startPersonaRefreshLoop' dashboard/frontend/js/reference-flow.js
      - name: Verify ChatGPT terminal failure handling
        run: |
          grep -q 'image-generation tool encountered an error' scripts/chatgpt_web_watchdog.py
          grep -q 'CHATGPT_TERMINAL_RESPONSE_GRACE_SECONDS' scripts/chatgpt_web_watchdog.py
          grep -q 'CHATGPT_PROCESS_TIMEOUT_SECONDS' dashboard/backend/chatgpt_watchdog.py
          grep -q -- '--continue-on-error' dashboard/backend/chatgpt_watchdog.py
