name: Reference flow checks

on:
  pull_request:
    paths:
      - "dashboard/backend/reference_flow.py"
      - "dashboard/backend/reference_library.py"
      - "dashboard/backend/reference_workspace.py"
      - "dashboard/backend/reference_workspace_v2.py"
      - "dashboard/backend/chatgpt_watchdog.py"
      - "dashboard/backend/chatgpt_runtime_patch.py"
      - "dashboard/backend/routes/execute.py"
      - "dashboard/backend/routes/runs.py"
      - "dashboard/frontend/index.html"
      - "dashboard/frontend/reference-flow.css"
      - "dashboard/frontend/reference-product-selection.css"
      - "dashboard/frontend/js/reference-flow.js"
      - "dashboard/frontend/js/reference-product-selection.js"
      - "dashboard/frontend/js/image-comments.js"
      - "scripts/chatgpt_web_watchdog.py"
      - "scripts/reference_image_job.py"
      - ".github/workflows/reference-flow-checks.yml"
  push:
    branches:
      - feature/reference-image-flow
      - fix/reference-persona-refresh-chatgpt-failures
      - feature/reference-workspace-polish
      - fix/reference-product-selection-cancel-prompt

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python files
        run: >-
          python -m py_compile
          dashboard/backend/reference_flow.py
          dashboard/backend/reference_library.py
          dashboard/backend/reference_workspace.py
          dashboard/backend/reference_workspace_v2.py
          dashboard/backend/chatgpt_watchdog.py
          dashboard/backend/chatgpt_runtime_patch.py
          dashboard/backend/routes/execute.py
          dashboard/backend/routes/runs.py
          scripts/chatgpt_web_watchdog.py
          scripts/reference_image_job.py
      - name: Check frontend modules
        run: |
          node --check dashboard/frontend/js/reference-flow.js
          node --check dashboard/frontend/js/reference-product-selection.js
          node --check dashboard/frontend/js/image-comments.js
      - name: Verify workspace contracts
        run: |
          grep -q 'id="referenceFlowPanel"' dashboard/frontend/index.html
          grep -q 'id="generationWorkspace"' dashboard/frontend/index.html
          grep -q 'id="referenceProgressText"' dashboard/frontend/index.html
          grep -q 'id="referenceProductImageSummary"' dashboard/frontend/index.html
          ! grep -q 'id="referenceStatus"' dashboard/frontend/index.html
          grep -q '/api/reference-workspace' dashboard/backend/routes/execute.py
          grep -q '/api/runs/execute-reference' dashboard/backend/routes/execute.py
          grep -q 'reference_comments' dashboard/frontend/js/reference-flow.js
          grep -q 'reference_comment' dashboard/backend/reference_workspace.py
          grep -q 'product_image_paths' dashboard/frontend/js/reference-product-selection.js
          grep -q 'product_image_paths' dashboard/backend/reference_workspace_v2.py
          grep -q 'STARTING_PROMPT_PATH' dashboard/backend/reference_workspace.py
          grep -q 'LEGACY_PROMPT_MARKERS' dashboard/backend/reference_workspace_v2.py
          grep -q 'ref_v' dashboard/backend/reference_library.py
          grep -q '8% clear margin' dashboard/backend/reference_flow.py
      - name: Verify immediate reference cancellation
        run: |
          grep -q 'reference_image_job.py' dashboard/backend/reference_workspace_v2.py
          grep -q '_terminate_process_tree' dashboard/backend/reference_workspace_v2.py
          grep -q 'cancel_event.is_set' dashboard/backend/reference_workspace_v2.py
          grep -q 'start_new_session' dashboard/backend/reference_workspace_v2.py
      - name: Verify live persona synchronization
        run: |
          grep -q 'refreshReferencePersonas' dashboard/frontend/js/reference-flow.js
          grep -q '/api/defaults?t=' dashboard/frontend/js/reference-flow.js
          grep -q 'startPersonaSync' dashboard/frontend/js/reference-flow.js
      - name: Verify ChatGPT failure handling
        run: |
          grep -q 'image-generation tool encountered an error' scripts/chatgpt_web_watchdog.py
          grep -q 'CHATGPT_TERMINAL_RESPONSE_GRACE_SECONDS' scripts/chatgpt_web_watchdog.py
          grep -q 'CHATGPT_PROCESS_TIMEOUT_SECONDS' dashboard/backend/chatgpt_watchdog.py
          grep -q -- '--continue-on-error' dashboard/backend/chatgpt_watchdog.py
