<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
      padding: 16px;
    }
    h1 { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    h1 .dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    }
    .dot-connected { background: #34A853; }
    .dot-connecting { background: #FBBC05; }
    .dot-disconnected { background: #EA4335; }

    .field { margin-bottom: 10px; }
    .field label { display: block; font-weight: 500; margin-bottom: 4px; font-size: 12px; color: #666; }
    .field input {
      width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px;
      font-size: 13px; outline: none;
    }
    .field input:focus { border-color: #4285F4; }

    .btn {
      width: 100%; padding: 10px; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    }
    .btn-connect { background: #4285F4; color: #fff; }
    .btn-connect:hover { background: #3367D6; }
    .btn-disconnect { background: #EA4335; color: #fff; }
    .btn-disconnect:hover { background: #C5221F; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      margin-top: 12px; padding: 10px; border-radius: 6px;
      font-size: 12px; background: #f8f9fa; color: #666;
    }
    .status.error { background: #fce8e6; color: #C5221F; }
    .status.success { background: #e6f4ea; color: #137333; }

    .tabs-section { margin-top: 12px; }
    .tabs-section h2 { font-size: 12px; font-weight: 600; color: #666; margin-bottom: 6px; }
    .tab-list { max-height: 150px; overflow-y: auto; }
    .tab-item {
      padding: 6px 8px; border-radius: 4px; font-size: 12px;
      display: flex; align-items: center; gap: 6px;
    }
    .tab-item:hover { background: #f1f3f4; }
    .tab-item .tab-dot { width: 6px; height: 6px; border-radius: 50%; }
    .tab-item .tab-dot.attached { background: #34A853; }
    .tab-item .tab-dot.unattached { background: #ccc; }
    .tab-item .tab-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <h1>
    <span class="dot dot-disconnected" id="statusDot"></span>
    Ad Factory Bridge
  </h1>

  <div class="field">
    <label>Session Token</label>
    <input type="password" id="sessionInput" placeholder="Paste your session cookie" />
  </div>

  <button class="btn btn-connect" id="connectBtn">Connect</button>

  <div class="status" id="statusText">Not connected</div>

  <div class="tabs-section" id="tabsSection" style="display:none">
    <h2>OPEN TABS</h2>
    <div class="tab-list" id="tabList"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
