<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO — admin pages are private, exclude from indexing -->
  <title>Admin Dashboard — Ad Factory</title>
  <meta name="description" content="Super Admin dashboard for Ad Factory — users, organizations, configs, audit logs, readiness checks, and data exports." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Open Graph -->
  <meta property="og:title" content="Admin Dashboard — Ad Factory" />
  <meta property="og:description" content="Super Admin control panel. Manage users, orgs, configs, and platform health." />
  <meta property="og:site_name" content="Ad Factory" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <script>
    (function(){var t=localStorage.getItem("dashboard_theme");if(t==="dark"||t==="light"){document.documentElement.setAttribute("data-theme",t)}else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches){document.documentElement.setAttribute("data-theme","dark")}})();
  </script>
</head>
<body>

  <!-- ── Navbar ──────────────────────────────────────────────────────── -->
  <header class="app-header" role="banner">
    <a href="/" class="app-header-logo" aria-label="Ad Factory home">
      <div class="app-header-logo-mark" aria-hidden="true">AF</div>
      <span class="app-header-brand">Ad <span>Factory</span></span>
    </a>
    <nav class="app-nav" aria-label="Main navigation">
      <a href="/" class="app-nav-link"><span class="app-nav-icon" aria-hidden="true">&#9881;</span> Studio</a>
      <a href="/config.html" class="app-nav-link"><span class="app-nav-icon" aria-hidden="true">&#9998;</span> Config</a>
      <a href="/organizations.html" class="app-nav-link"><span class="app-nav-icon" aria-hidden="true">&#128101;</span> Teams</a>
      <a href="/traces.html" class="app-nav-link"><span class="app-nav-icon" aria-hidden="true">&#128202;</span> LLM Traces</a>
      <a href="/profile.html" class="app-nav-link"><span class="app-nav-icon" aria-hidden="true">&#128100;</span> Profile</a>
      <a href="/admin.html" class="app-nav-link active" data-admin aria-current="page"><span class="app-nav-icon" aria-hidden="true">&#128736;</span> Admin</a>
    </nav>
    <div class="app-header-right">
      <button id="themeToggle" class="app-theme-btn" type="button" aria-label="Toggle theme">&#9728;</button>
      <div class="app-user-chip">
        <div class="app-avatar"><span id="authInitial">…</span></div>
        <span class="app-user-name loading" id="authName">Loading</span>
      </div>
      <button id="logoutBtn" class="app-logout-btn" type="button" style="display:none">Sign out</button>
      <a href="/api/auth/google/login" class="app-login-btn" id="loginBtn" style="display:none">Sign in</a>
    </div>
  </header>

  <!-- ── Access gate (shown while checking auth) ───────────────────── -->
  <div id="accessGate" class="sub-page" style="text-align:center;padding-top:5rem">
    <div class="sp-skeleton sp-skeleton-line medium" style="margin:0 auto 8px;max-width:240px"></div>
    <div class="sp-skeleton sp-skeleton-line short" style="margin:0 auto;max-width:140px"></div>
  </div>

  <!-- ── Admin panel (shown only to super admins) ──────────────────── -->
  <div class="sub-page-wide" id="adminPageWrap" style="display:none">
    <div class="page-hero">
      <p class="page-hero-eyebrow">Super Admin</p>
      <h1>Admin Dashboard</h1>
      <p>Platform-wide management — users, organizations, configs, audit logs, readiness, and exports.</p>
    </div>
    <!-- admin.js renders into this element -->
    <div id="adminPanel" class="admin-panel"></div>
  </div>

  <footer class="app-footer" role="contentinfo">
    <span class="app-footer-brand">Ad Factory &mdash; AI Creative Platform</span>
    <nav class="app-footer-links" aria-label="Footer links">
      <a href="/">Studio</a>
      <a href="/config.html">Config</a>
      <a href="/organizations.html">Teams</a>
      <a href="/traces.html">LLM Traces</a>
      <a href="/profile.html">Profile</a>
    </nav>
  </footer>

  <script type="module">
    import { initTheme } from "/js/theme.js";
    import { checkAuth } from "/js/auth.js";

    initTheme();

    checkAuth().then(async user => {
      const initial = document.getElementById("authInitial");
      const name    = document.getElementById("authName");
      const logout  = document.getElementById("logoutBtn");
      const login   = document.getElementById("loginBtn");
      const gate    = document.getElementById("accessGate");
      const wrap    = document.getElementById("adminPageWrap");

      if (user.authenticated) {
        const dn = user.display_name || user.email || "User";
        initial.textContent = dn.charAt(0).toUpperCase();
        name.textContent    = dn.split(" ")[0];
        name.classList.remove("loading");
        logout.style.display = "";
        login.style.display  = "none";
      } else {
        initial.textContent = "?";
        name.textContent    = "Guest";
        name.classList.remove("loading");
        login.style.display  = "";
        logout.style.display = "none";
      }

      logout.addEventListener("click", async () => {
        try { await fetch("/api/auth/logout", { method: "POST" }); } catch {}
        window.location.href = "/";
      });

      if (!user.authenticated) {
        gate.innerHTML = `
          <div class="sp-empty">
            <span class="sp-empty-icon">&#128274;</span>
            <div class="sp-empty-title">Authentication required</div>
            <div class="sp-empty-desc">Sign in to access the admin dashboard.</div>
            <br/><a href="/api/auth/google/login" class="app-login-btn" style="display:inline-flex;margin:auto">Sign in with Google</a>
          </div>`;
        return;
      }

      if (!user.is_super_admin) {
        gate.innerHTML = `
          <div class="sp-empty">
            <span class="sp-empty-icon">&#128683;</span>
            <div class="sp-empty-title">Access Denied</div>
            <div class="sp-empty-desc">This page is restricted to super administrators.</div>
            <br/><a href="/" class="ghost-btn" style="display:inline-flex;margin:auto;text-decoration:none">Back to Studio</a>
          </div>`;
        return;
      }

      // Authenticated super admin — show admin panel
      gate.style.display = "none";
      wrap.style.display = "";

      // Set initial hash if none
      if (!window.location.hash.startsWith("#admin/")) {
        window.location.hash = "admin/overview";
      }

      const { renderAdminPanel } = await import("/js/admin.js");
      renderAdminPanel();

      // Re-render when hash changes (admin.js sidebar sets hash)
      window.addEventListener("hashchange", () => {
        if (window.location.hash.startsWith("#admin/")) {
          renderAdminPanel();
        }
      });
    });
  </script>
</body>
</html>
