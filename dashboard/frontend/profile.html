<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary SEO -->
  <title>Profile &amp; Credentials — Ad Factory</title>
  <meta name="description" content="Manage your Ad Factory account — display name, provider configurations, and quick access to your workspace." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Open Graph -->
  <meta property="og:title" content="Profile — Ad Factory" />
  <meta property="og:description" content="Manage your account, credentials, and provider configs." />
  <meta property="og:site_name" content="Ad Factory" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- ── Navbar ──────────────────────────────────────────────────────── -->
  <header class="app-header" role="banner">
    <a href="/" class="app-header-logo" aria-label="Ad Factory home">
      <div class="app-header-logo-mark" aria-hidden="true">AF</div>
      <span class="app-header-brand">Ad <span>Factory</span></span>
    </a>
    <nav class="app-nav" aria-label="Main navigation">
      <a href="/" class="app-nav-link"><span class="app-nav-icon" aria-hidden="true">&#9881;</span> Studio</a>
      <a href="/config.html" class="app-nav-link"><span class="app-nav-icon" aria-hidden="true">&#9998;</span> Config</a>
      <a href="/organizations.html" class="app-nav-link"><span class="app-nav-icon" aria-hidden="true">&#128101;</span> Teams</a>
      <a href="/traces.html" class="app-nav-link"><span class="app-nav-icon" aria-hidden="true">&#128202;</span> LLM Traces</a>
      <a href="/profile.html" class="app-nav-link active" aria-current="page"><span class="app-nav-icon" aria-hidden="true">&#128100;</span> Profile</a>
      <a href="/admin.html" class="app-nav-link" data-admin id="adminNavLink" style="display:none"><span class="app-nav-icon" aria-hidden="true">&#128736;</span> Admin</a>
    </nav>
    <div class="app-header-right">
      <button id="themeToggle" class="app-theme-btn" type="button" aria-label="Toggle theme">&#9728;</button>
      <div class="app-user-chip">
        <div class="app-avatar"><span id="authInitial">…</span></div>
        <span class="app-user-name loading" id="authName">Loading</span>
      </div>
      <button id="logoutBtn" class="app-logout-btn" type="button" style="display:none">Sign out</button>
      <a href="/api/auth/google/login" class="app-login-btn" id="loginBtn" style="display:none">Sign in</a>
    </div>
  </header>

  <!-- ── Page Content ───────────────────────────────────────────────── -->
  <main class="sub-page" id="profileRoot" aria-label="Profile and account settings">

    <div class="page-hero">
      <p class="page-hero-eyebrow">Account</p>
      <h1>Profile &amp; Credentials</h1>
      <p>Your identity, provider configurations, and workspace links.</p>
    </div>

    <!-- Loaded dynamically -->
    <div id="profilePanel"></div>

  </main>

  <footer class="app-footer" role="contentinfo">
    <span class="app-footer-brand">Ad Factory &mdash; AI Creative Platform</span>
    <nav class="app-footer-links" aria-label="Footer links">
      <a href="/">Studio</a>
      <a href="/config.html">Config</a>
      <a href="/organizations.html">Teams</a>
      <a href="/traces.html">LLM Traces</a>
      <a href="/profile.html">Profile</a>
    </nav>
  </footer>

  <script type="module">
    import { initTheme } from "/js/theme.js";
    import { checkAuth, initAuth } from "/js/auth.js";
    import { renderProfilePanel } from "/js/profile.js";

    initTheme();

    checkAuth().then(user => {
      const initial = document.getElementById("authInitial");
      const name    = document.getElementById("authName");
      const logout  = document.getElementById("logoutBtn");
      const login   = document.getElementById("loginBtn");
      const adminLink = document.getElementById("adminNavLink");

      if (user.authenticated) {
        const displayName = user.display_name || user.email || "User";
        initial.textContent = displayName.charAt(0).toUpperCase();
        name.textContent = displayName.split(" ")[0];
        name.classList.remove("loading");
        logout.style.display = "";
        login.style.display = "none";
        if (user.is_super_admin && adminLink) adminLink.style.display = "";
      } else {
        initial.textContent = "?";
        name.textContent = "Guest";
        name.classList.remove("loading");
        login.style.display = "";
        logout.style.display = "none";
      }

      logout.addEventListener("click", async () => {
        try { await fetch("/api/auth/logout", { method: "POST" }); } catch {}
        window.location.href = "/";
      });

      // Render profile (profile.js targets #profilePanel)
      renderProfilePanel();
    });
  </script>
</body>
</html>
